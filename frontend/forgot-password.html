<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — TaskFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
  <style>
    .forgot-page-body {
      background-color: var(--color-bg-panel-left);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .forgot-card {
      width: 100%;
      max-width: 440px;
      background: var(--color-bg-white);
      border: 1px solid var(--color-border-input);
      border-radius: var(--radius-card);
      padding: 40px 36px;
      box-shadow: var(--shadow-card);
    }
    .forgot-back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--color-text-secondary);
      margin-top: 24px;
      transition: color var(--transition-fast);
    }
    .forgot-back-link:hover {
      color: var(--color-primary);
    }
  </style>
</head>
<body class="forgot-page-body">
  <div class="forgot-card">
    <div style="margin-bottom: 24px; text-align: center;">
      <a href="index.html" class="brand-logo" aria-label="TaskFlow Home">
        <div class="logo-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <span class="brand-name">TaskFlow</span>
      </a>
    </div>

    <header class="form-header" style="text-align: center;">
      <h1 class="form-title" style="font-size: 1.65rem;">Reset your password</h1>
      <p class="form-subtitle">Enter your work email address and we'll send you a link to reset your password.</p>
    </header>

    <div class="dev-notice-banner notice-info" style="display: flex; margin-bottom: 20px;">
      <svg class="notice-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
      <span>Password recovery route will connect to SMTP mailer service.</span>
    </div>

    <form onsubmit="event.preventDefault(); alert('Password reset link instructions sent to your email.');">
      <div class="form-group">
        <label class="form-label" for="resetEmail">Email address</label>
        <input type="email" id="resetEmail" class="form-input" placeholder="you@example.com" required>
      </div>

      <button type="submit" class="btn-submit" style="margin-top: 8px;">
        <span>Send Reset Link</span>
      </button>
    </form>

    <div style="text-align: center;">
      <a href="login.html" class="forgot-back-link">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        <span>Back to Sign In</span>
      </a>
    </div>
  </div>
</body>
</html>
